async function submitSuggestion(name, message) {
  const configured = CONFIG.FORMSPREE_ENDPOINT && !CONFIG.FORMSPREE_ENDPOINT.includes("YOUR_FORM_ID");
  if (!configured) {
    return { ok: false, reason: "not_configured" };
  }
  try {
    const res = await fetch(CONFIG.FORMSPREE_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json", Accept: "application/json" },
      body: JSON.stringify({ name, message }),
    });
    if (res.ok) return { ok: true };
    return { ok: false, reason: "send_failed" };
  } catch (err) {
    return { ok: false, reason: "send_failed" };
  }
}

/* ---------------------------------------------------------------------------
   Live species images — looked up from Wikipedia by botanical name so every
   image is a real, verified photo rather than a hand-typed link. Results
   are cached in memory so each species is only fetched once per visit.
   ------------------------------------------------------------------------- */
const wikiImageCache = {};

function useWikiImage(title) {
  const [state, setState] = useState(() => {
    if (title && wikiImageCache[title] !== undefined) {
      return { url: wikiImageCache[title], status: wikiImageCache[title] ? "loaded" : "failed" };
    }
    return { url: null, status: "loading" };
  });

  useEffect(() => {
    if (!title) { setState({ url: null, status: "failed" }); return; }
    if (wikiImageCache[title] !== undefined) {
      setState({ url: wikiImageCache[title], status: wikiImageCache[title] ? "loaded" : "failed" });
      return;
    }
    let cancelled = false;
    const apiUrl = "https://en.wikipedia.org/w/api.php?action=query&titles=" +
      encodeURIComponent(title) + "&prop=pageimages&format=json&pithumbsize=640&origin=*";
    fetch(apiUrl)
      .then((res) => res.json())
      .then((data) => {
        if (cancelled) return;
        const pages = data && data.query && data.query.pages;
        const page = pages && Object.values(pages)[0];
        const src = page && page.thumbnail && page.thumbnail.source;
        wikiImageCache[title] = src || null;
        setState({ url: src || null, status: src ? "loaded" : "failed" });
      })
      .catch(() => {
        if (cancelled) return;
        wikiImageCache[title] = null;
        setState({ url: null, status: "failed" });
      });
    return () => { cancelled = true; };
  }, [title]);

  return state;
}

function SpeciesImage({ title, alt, style }) {
  const { url, status } = useWikiImage(title);
  if (status === "loaded" && url) {
    return <img src={url} alt={alt} style={style} loading="lazy" />;
  }
  return (
    <div style={{
      ...style,
      background: "#E3DCC9",
      display: "flex",
      alignItems: "center",
      justifyContent: "center",
      textAlign: "center",
      padding: "8px",
      fontFamily: "Inter, sans-serif",
      fontSize: "0.72rem",
      color: "#8A9880",
    }}>
      {status === "loading" ? "Loading photo…" : "Photo not available"}
    </div>
  );
}

        <h2 style={{ fontFamily: "Lora, serif", fontSize: "1.7rem", color: "#1B2B1E", marginBottom: "8px" }}>How the atlas works</h2>
        <p style={{ fontFamily: "Inter, sans-serif", color: "#6B7A63", maxWidth: "62ch", marginBottom: "36px" }}>Three simple steps take you from a name to a location on the ground.</p>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(240px, 1fr))", gap: "28px" }}>
          {[
            { title: "Search or browse", body: "Filter the collection by family, origin, or intended use, or search directly by common or botanical name." },
            { title: "Read the record", body: "Each species page holds a description, phenology, taxonomy, and its ecological and traditional uses, with a photo gallery." },
            { title: "Find it on campus", body: "Jump straight to the map to see exactly where that species grows across the FRI grounds." },
          ].map((step) => (
            <div key={step.title} style={{ borderTop: "2px solid #4A6741", paddingTop: "16px" }}>
              <h3 style={{ fontFamily: "Lora, serif", fontSize: "1.1rem", color: "#1B2B1E", marginBottom: "8px" }}>{step.title}</h3>
              <p style={{ fontFamily: "Inter, sans-serif", fontSize: "0.92rem", color: "#4E5C47", lineHeight: 1.55 }}>{step.body}</p>
            </div>
          ))}
        </div>
      </section>

      <section style={{ background: "#1B2B1E", padding: "64px 24px" }}>
        <div style={{ maxWidth: "620px", margin: "0 auto" }}>
          <h2 style={{ fontFamily: "Lora, serif", fontSize: "1.6rem", color: "#F6F2E9", marginBottom: "8px" }}>Spotted something we've missed?</h2>
          <p style={{ fontFamily: "Inter, sans-serif", color: "#B9C4AE", marginBottom: "28px", lineHeight: 1.55 }}>Tell us about a species, a correction, or an idea for the atlas.</p>
          <form onSubmit={handleSubmit} style={{ display: "grid", gap: "14px" }}>
            <input type="text" placeholder="Your name" value={name} onChange={(e) => setName(e.target.value)} required
              style={{ fontFamily: "Inter, sans-serif", padding: "13px 15px", borderRadius: "5px", border: "1px solid #3A4739", background: "#24352770", color: "#F6F2E9", fontSize: "0.95rem", outline: "none" }} />
            <textarea placeholder="Message" value={message} onChange={(e) => setMessage(e.target.value)} required rows={4}
              style={{ fontFamily: "Inter, sans-serif", padding: "13px 15px", borderRadius: "5px", border: "1px solid #3A4739", background: "#24352770", color: "#F6F2E9", fontSize: "0.95rem", outline: "none", resize: "vertical" }} />
            <button type="submit" disabled={submitting} style={{ fontFamily: "Inter, sans-serif", fontWeight: 600, padding: "13px 24px", borderRadius: "5px", border: "none", cursor: submitting ? "default" : "pointer", background: "#A6452F", color: "#F6F2E9", opacity: submitting ? 0.7 : 1, justifySelf: "start" }}>
              {submitting ? "Sending…" : "Send suggestion"}
            </button>
            {status && <p style={{ fontFamily: "Inter, sans-serif", fontSize: "0.85rem", color: status.type === "success" ? "#B9D6A8" : "#E3B49A" }}>{status.text}</p>}
          </form>
        </div>
      </section>
    </div>
  );
}

function ExplorePage({ species, onOpenSpecies }) {
  const [query, setQuery] = useState("");
  const [family, setFamily] = useState("All");
  const [origin, setOrigin] = useState("All");
  const [useType, setUseType] = useState("All");

  const families = useMemo(() => ["All", ...new Set(species.map((s) => s.fields.Family).filter(Boolean))].sort(), [species]);
  const useTypes = useMemo(() => ["All", ...new Set(species.map((s) => s.fields.UseType).filter(Boolean))].sort(), [species]);

  const filtered = species.filter((s) => {
    const f = s.fields;
    const q = query.trim().toLowerCase();
    const matchesQuery = !q || (f.CommonName || "").toLowerCase().includes(q) || (f.BotanicalName || "").toLowerCase().includes(q);
    const matchesFamily = family === "All" || f.Family === family;
    const matchesOrigin = origin === "All" || f.Origin === origin;
    const matchesUse = useType === "All" || f.UseType === useType;
    return matchesQuery && matchesFamily && matchesOrigin && matchesUse;
  });

  const selectStyle = { fontFamily: "Inter, sans-serif", fontSize: "0.88rem", padding: "9px 12px", borderRadius: "5px", border: "1px solid #D6CEB4", background: "#FFFDF7", color: "#3A4739" };

  return (
    <div style={{ maxWidth: "1180px", margin: "0 auto", padding: "48px 24px 80px" }}>
      <h1 style={{ fontFamily: "Lora, serif", fontSize: "2.1rem", color: "#1B2B1E", marginBottom: "6px" }}>Explore the collection</h1>
      <p style={{ fontFamily: "Inter, sans-serif", color: "#6B7A63", marginBottom: "28px" }}>{filtered.length} of {species.length} species shown</p>

      <div style={{ display: "flex", gap: "10px", flexWrap: "wrap", marginBottom: "36px", alignItems: "center" }}>
        <input type="text" placeholder="Search common or botanical name…" value={query} onChange={(e) => setQuery(e.target.value)} style={{ ...selectStyle, flex: "1 1 240px", minWidth: "220px" }} />
        <select value={family} onChange={(e) => setFamily(e.target.value)} style={selectStyle}>
          {families.map((f) => <option key={f} value={f}>{f === "All" ? "All families" : f}</option>)}
        </select>
        <select value={origin} onChange={(e) => setOrigin(e.target.value)} style={selectStyle}>
          {["All", "Native", "Exotic"].map((o) => <option key={o} value={o}>{o === "All" ? "All origins" : o}</option>)}
        </select>
        <select value={useType} onChange={(e) => setUseType(e.target.value)} style={selectStyle}>
          {useTypes.map((u) => <option key={u} value={u}>{u === "All" ? "All uses" : u}</option>)}
        </select>
      </div>

      {filtered.length === 0 ? (
        <div style={{ border: "1px dashed #D6CEB4", borderRadius: "8px", padding: "48px 24px", textAlign: "center", fontFamily: "Inter, sans-serif", color: "#6B7A63" }}>
          No species match these filters. Try widening your search.
        </div>
      ) : (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(240px, 1fr))", gap: "22px" }}>
          {filtered.map((s) => {
            const f = s.fields;
            return (
              <button key={s.id} onClick={() => onOpenSpecies(s)} style={{ textAlign: "left", cursor: "pointer", background: "#FFFDF7", border: "1px solid #E3DCC9", borderRadius: "8px", overflow: "hidden", padding: 0, display: "flex", flexDirection: "column", transition: "transform 0.15s ease, box-shadow 0.15s ease" }}
                onMouseEnter={(e) => { e.currentTarget.style.transform = "translateY(-3px)"; e.currentTarget.style.boxShadow = "0 10px 24px rgba(27,43,30,0.1)"; }}
                onMouseLeave={(e) => { e.currentTarget.style.transform = "translateY(0)"; e.currentTarget.style.boxShadow = "none"; }}>
                <div style={{ height: "150px", overflow: "hidden" }}>
                  <SpeciesImage title={f.BotanicalName} alt={f.CommonName} style={{ width: "100%", height: "100%", objectFit: "cover" }} />
                </div>
                <div style={{ padding: "14px 16px 18px" }}>
                  <div style={{ marginBottom: "8px" }}><OriginTag origin={f.Origin} /></div>
                  <h3 style={{ fontFamily: "Lora, serif", fontSize: "1.08rem", color: "#1B2B1E", margin: "0 0 2px" }}>{f.CommonName}</h3>
                  <p style={{ fontFamily: "Inter, sans-serif", fontStyle: "italic", fontSize: "0.84rem", color: "#7A8873", margin: "0 0 8px" }}>{f.BotanicalName}</p>
                  <p style={{ fontFamily: "Inter, sans-serif", fontSize: "0.78rem", color: "#6B7A63", margin: 0 }}>{f.Family}</p>
                </div>
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

function SpeciesDetailPage({ record, onBack, onViewOnMap }) {
  const f = record.fields;
  const sectionStyle = { marginBottom: "28px" };
  const labelStyle = { fontFamily: "Inter, sans-serif", fontSize: "0.72rem", letterSpacing: "0.04em", color: "#8A9880", marginBottom: "6px", fontWeight: 600 };
  const bodyStyle = { fontFamily: "Inter, sans-serif", fontSize: "0.96rem", color: "#2E3B28", lineHeight: 1.65 };

  return (
    <div style={{ maxWidth: "980px", margin: "0 auto", padding: "40px 24px 80px" }}>
      <button onClick={onBack} style={{ fontFamily: "Inter, sans-serif", fontSize: "0.88rem", color: "#4A6741", background: "none", border: "none", cursor: "pointer", marginBottom: "20px", padding: 0 }}>← Back to collection</button>
      <div style={{ marginBottom: "6px" }}><OriginTag origin={f.Origin} /></div>
      <h1 style={{ fontFamily: "Lora, serif", fontSize: "2.2rem", color: "#1B2B1E", margin: "8px 0 2px" }}>{f.CommonName}</h1>
      <p style={{ fontFamily: "Inter, sans-serif", fontStyle: "italic", fontSize: "1.05rem", color: "#7A8873", marginBottom: "24px" }}>{f.BotanicalName} · {f.Family}</p>

      <div style={{ marginBottom: "36px" }}>
        <SpeciesImage
          title={f.BotanicalName}
          alt={f.CommonName}
          style={{ width: "100%", height: "380px", objectFit: "cover", borderRadius: "6px", border: "1px solid #E3DCC9" }}
        />
      </div>

      <button onClick={() => onViewOnMap(record)} style={{ fontFamily: "Inter, sans-serif", fontWeight: 600, fontSize: "0.9rem", padding: "12px 22px", borderRadius: "5px", border: "none", cursor: "pointer", background: "#4A6741", color: "#F6F2E9", marginBottom: "40px" }}>
        View location on campus map
      </button>

      {f.Description && <div style={sectionStyle}><div style={labelStyle}>DESCRIPTION</div><p style={bodyStyle}>{f.Description}</p></div>}
      {f.Phenology && <div style={sectionStyle}><div style={labelStyle}>PHENOLOGY</div><p style={bodyStyle}>{f.Phenology}</p></div>}
      {f.Taxonomy && <div style={sectionStyle}><div style={labelStyle}>TAXONOMY</div><p style={bodyStyle}>{f.Taxonomy}</p></div>}
      {f.EcologicalUses && <div style={sectionStyle}><div style={labelStyle}>ECOLOGICAL ROLE</div><p style={bodyStyle}>{f.EcologicalUses}</p></div>}
      {f.EthnobotanicalUses && <div style={sectionStyle}><div style={labelStyle}>ETHNOBOTANICAL USES</div><p style={bodyStyle}>{f.EthnobotanicalUses}</p></div>}
      {f.SourceNote && (
        <div style={{ marginTop: "40px", padding: "14px 16px", borderRadius: "6px", background: "#EFEADB", fontFamily: "Inter, sans-serif", fontSize: "0.8rem", color: "#6B7A63" }}>
          <strong style={{ color: "#4E5C47" }}>Source note: </strong>{f.SourceNote}
        </div>
      )}
    </div>
  );
}

function MapPage({ species, focusedId }) {
  const [query, setQuery] = useState("");
  const [family, setFamily] = useState("All");
  const [selected, setSelected] = useState(null);
  const mapContainerRef = useRef(null);
  const mapInstanceRef = useRef(null);
  const markersRef = useRef([]);

  const withCoords = species.filter((s) => s.fields.Latitude != null && s.fields.Longitude != null);
  const families = useMemo(() => ["All", ...new Set(withCoords.map((s) => s.fields.Family).filter(Boolean))].sort(), [withCoords]);

  const filtered = withCoords.filter((s) => {
    const f = s.fields;
    const q = query.trim().toLowerCase();
    const matchesQuery = !q || (f.CommonName || "").toLowerCase().includes(q) || (f.BotanicalName || "").toLowerCase().includes(q);
    const matchesFamily = family === "All" || f.Family === family;
    return matchesQuery && matchesFamily;
  });

  // Initialize the Leaflet map once on mount.
  useEffect(() => {
    if (!mapContainerRef.current || mapInstanceRef.current) return;
    const map = L.map(mapContainerRef.current, { scrollWheelZoom: true }).setView([30.34287, 77.99851], 16);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    }).addTo(map);
    mapInstanceRef.current = map;
    return () => {
      map.remove();
      mapInstanceRef.current = null;
    };
  }, []);

  // Redraw markers whenever the filtered species list changes.
  useEffect(() => {
    const map = mapInstanceRef.current;
    if (!map) return;

    markersRef.current.forEach((m) => map.removeLayer(m));
    markersRef.current = [];

    const leafIcon = (isSelected) => L.divIcon({
      className: "",
      html: `<svg width="${isSelected ? 30 : 22}" height="${isSelected ? 30 : 22}" viewBox="0 0 24 24"><path d="M12 2C7.6 2 4 5.6 4 10c0 6 8 12 8 12s8-6 8-12c0-4.4-3.6-8-8-8Z" fill="${isSelected ? "#A6452F" : "#4A6741"}" stroke="#F6F2E9" stroke-width="1"/></svg>`,
      iconSize: [isSelected ? 30 : 22, isSelected ? 30 : 22],
      iconAnchor: [isSelected ? 15 : 11, isSelected ? 30 : 22],
    });

    filtered.forEach((s) => {
      const f = s.fields;
      const marker = L.marker([f.Latitude, f.Longitude], { icon: leafIcon(selected && selected.id === s.id) })
        .addTo(map)
        .bindPopup(`<strong>${f.CommonName}</strong><br/><em>${f.BotanicalName}</em>`);
      marker.on("click", () => setSelected(s));
      markersRef.current.push(marker);
    });
  }, [filtered, selected]);

  // Pan/zoom to a focused species (arriving from a detail page "view on map" click).
  useEffect(() => {
    if (!focusedId) return;
    const match = withCoords.find((s) => s.id === focusedId);
    if (match && mapInstanceRef.current) {
      setSelected(match);
      mapInstanceRef.current.setView([match.fields.Latitude, match.fields.Longitude], 18, { animate: true });
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [focusedId]);

  const selectStyle = { fontFamily: "Inter, sans-serif", fontSize: "0.88rem", padding: "9px 12px", borderRadius: "5px", border: "1px solid #D6CEB4", background: "#FFFDF7", color: "#3A4739" };

  return (
    <div style={{ maxWidth: "1180px", margin: "0 auto", padding: "40px 24px 80px" }}>
      <h1 style={{ fontFamily: "Lora, serif", fontSize: "2rem", color: "#1B2B1E", marginBottom: "6px" }}>Campus species map</h1>
      <p style={{ fontFamily: "Inter, sans-serif", color: "#6B7A63", marginBottom: "24px" }}>{filtered.length} mapped location{filtered.length === 1 ? "" : "s"}. Click a marker for details.</p>

      <div style={{ display: "flex", gap: "10px", flexWrap: "wrap", marginBottom: "20px" }}>
        <input type="text" placeholder="Search by name…" value={query} onChange={(e) => setQuery(e.target.value)} style={{ ...selectStyle, flex: "1 1 220px" }} />
        <select value={family} onChange={(e) => setFamily(e.target.value)} style={selectStyle}>
          {families.map((f) => <option key={f} value={f}>{f === "All" ? "All families" : f}</option>)}
        </select>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 320px", gap: "20px", alignItems: "start" }}>
        <div ref={mapContainerRef} style={{ height: "520px", borderRadius: "10px", border: "1px solid #E3DCC9" }} />

        <div style={{ border: "1px solid #E3DCC9", borderRadius: "10px", padding: "20px", background: "#FFFDF7", minHeight: "200px" }}>
          {selected ? (
            <>
              <div style={{ marginBottom: "12px" }}>
                <SpeciesImage title={selected.fields.BotanicalName} alt={selected.fields.CommonName} style={{ width: "100%", height: "120px", objectFit: "cover", borderRadius: "6px" }} />
              </div>
              <div style={{ marginBottom: "6px" }}><OriginTag origin={selected.fields.Origin} /></div>
              <h3 style={{ fontFamily: "Lora, serif", fontSize: "1.1rem", color: "#1B2B1E", margin: "4px 0 2px" }}>{selected.fields.CommonName}</h3>
              <p style={{ fontFamily: "Inter, sans-serif", fontStyle: "italic", fontSize: "0.85rem", color: "#7A8873", marginBottom: "10px" }}>{selected.fields.BotanicalName}</p>
              <p style={{ fontFamily: "Inter, sans-serif", fontSize: "0.86rem", color: "#4E5C47", lineHeight: 1.5 }}>
                {selected.fields.Description ? selected.fields.Description.slice(0, 140) + (selected.fields.Description.length > 140 ? "…" : "") : "No description on file yet."}
              </p>
            </>
          ) : (
            <p style={{ fontFamily: "Inter, sans-serif", fontSize: "0.9rem", color: "#8A9880" }}>Select a marker to see species details here.</p>
          )}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [page, setPage] = useState("home");
  const [selectedSpecies, setSelectedSpecies] = useState(null);
  const [mapFocusId, setMapFocusId] = useState(null);
  const species = SPECIES_DATA;

  const openSpecies = useCallback((record) => { setSelectedSpecies(record); setPage("detail"); window.scrollTo(0, 0); }, []);
  const viewOnMap = useCallback((record) => { setMapFocusId(record.id); setPage("map"); window.scrollTo(0, 0); }, []);
  const goTo = (id) => { setPage(id); window.scrollTo(0, 0); };

  return (
    <div style={{ fontFamily: "Inter, sans-serif", background: "#F6F2E9", minHeight: "100vh" }}>
      <NavBar page={page === "detail" ? "explore" : page} setPage={goTo} />
      {page === "home" ? (
        <HomePage speciesCount={species.length} setPage={goTo} />
      ) : page === "explore" ? (
        <ExplorePage species={species} onOpenSpecies={openSpecies} />
      ) : page === "detail" && selectedSpecies ? (
        <SpeciesDetailPage record={selectedSpecies} onBack={() => goTo("explore")} onViewOnMap={viewOnMap} />
      ) : page === "map" ? (
        <MapPage species={species} focusedId={mapFocusId} />
      ) : (
        <HomePage speciesCount={species.length} setPage={goTo} />
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
