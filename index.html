const {useState, useEffect, useMemo, useCallback, useRef} = React;

/* ============================================================================
   FRI TREE ATLAS — standalone single-file build (v3)
   ============================================================================
   This version has the full 71-species verified database built directly
   into the page — no external database connection required. Everything
   works the moment you open this file or host it on GitHub Pages.

   TO CONNECT THE SUGGESTION FORM TO YOUR EMAIL:
   This file uses Formspree (a free service) so the "Send suggestion" button
   emails you directly with no mail app popup. You must create a free
   Formspree endpoint once — see SETUP INSTRUCTIONS provided alongside this
   file for the exact steps. Until you paste your endpoint into
   FORMSPREE_ENDPOINT below, the form will show a friendly notice instead
   of silently failing.
   ========================================================================= */

const CONFIG = {

/* ---------------------------------------------------------------------------
   Species data now comes from species.csv, sitting alongside this file in
   the same folder/repo. Add a row to add a species. Fill in Latitude and
   Longitude to place it on the map. Fill in CoverImageURL with a real
   direct image link to use a specific photo for that species — leave it
   blank and the site automatically finds a real Wikipedia photo instead.

   FALLBACK_SPECIES below is only used if species.csv can't be loaded (for
   example, if you're double-clicking this file locally rather than
   viewing it through GitHub Pages, since browsers block a local page from
   fetching another local file). It keeps the page from looking broken in
   that situation, but your real data always comes from species.csv once
   the site is live.
   ------------------------------------------------------------------------- */
const FALLBACK_SPECIES = [
  { id: "fallback-1", fields: {
    CommonName: "Sal", BotanicalName: "Shorea robusta", Family: "Dipterocarpaceae",
    Origin: "Native", PotentialUse: "Timber",
    Description: "A large deciduous tree native to India, Bangladesh, Nepal and the Himalayan foothills, historically one of the dominant forest species of the Indian subcontinent.",
    Phenology: "Deciduous; flowering generally occurs in spring.",
    Taxonomy: "Kingdom Plantae; Order Malvales; Family Dipterocarpaceae; Genus Shorea.",
    EcologicalUses: "Forms the dominant canopy of sal forest ecosystems across the Himalayan foothills.",
    EthnobotanicalUses: "Wood used for construction; leaves used for leaf plates; bark and resin used in traditional medicine.",
    Latitude: 30.3398, Longitude: 78.0349, CoverImageURL: "",
    SourceNote: "Built-in sample shown only when species.csv can't be reached." }},
  { id: "fallback-2", fields: {
    CommonName: "Teak", BotanicalName: "Tectona grandis", Family: "Lamiaceae",
    Origin: "Native", PotentialUse: "Timber",
    Description: "A large deciduous hardwood tree native to south and southeast Asia, source of one of the world's most valuable timbers.",
    Phenology: "Fragrant white flowers bloom June to August.",
    Taxonomy: "Kingdom Plantae; Order Lamiales; Family Lamiaceae; Genus Tectona.",
    EcologicalUses: "Component of monsoon forest vegetation.",
    EthnobotanicalUses: "Highly durable timber used for boat-building, furniture and construction.",
    Latitude: 30.3385, Longitude: 78.0342, CoverImageURL: "",
    SourceNote: "Built-in sample shown only when species.csv can't be reached." }},
];

function loadSpeciesFromCsv(onDone) {
  if (typeof Papa === "undefined") { onDone(FALLBACK_SPECIES, "error"); return; }
  Papa.parse(CONFIG.SPECIES_CSV_PATH, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function (results) {
      const rows = (results && results.data) || [];
      const records = rows
        .filter(function (r) { return r.CommonName && r.CommonName.trim(); })
        .map(function (r, i) {
          return {
            id: "row" + i,
            fields: Object.assign({}, r, {
              Latitude: r.Latitude && r.Latitude.trim() !== "" ? parseFloat(r.Latitude) : null,
              Longitude: r.Longitude && r.Longitude.trim() !== "" ? parseFloat(r.Longitude) : null,
            }),
          };
        });
      if (records.length > 0) {
        onDone(records, "loaded");
      } else {
        onDone(FALLBACK_SPECIES, "error");
      }
    },
    error: function () {
      onDone(FALLBACK_SPECIES, "error");
    },
  });
}



async function submitSuggestion(name, message) {
  const configured = CONFIG.FORMSPREE_ENDPOINT && !CONFIG.FORMSPREE_ENDPOINT.includes("YOUR_FORM_ID");
  if (!configured) {
    return { ok: false, reason: "not_configured" };
  }
  try {
    const res = await fetch(CONFIG.FORMSPREE_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json", Accept: "application/json" },
      body: JSON.stringify({ name, message }),
    });
    if (res.ok) return { ok: true };
    return { ok: false, reason: "send_failed" };
  } catch (err) {
    return { ok: false, reason: "send_failed" };
  }
}

/* ---------------------------------------------------------------------------
   Live species images — looked up from Wikipedia by botanical name so every
   image is a real, verified photo rather than a hand-typed link. Results
   are cached in memory so each species is only fetched once per visit.
   ------------------------------------------------------------------------- */
const wikiImageCache = {};

function useWikiImage(title) {
  const [state, setState] = useState(() => {
    if (!title) return { url: null, status: "idle" };
    if (wikiImageCache[title] !== undefined) {
      return { url: wikiImageCache[title], status: wikiImageCache[title] ? "loaded" : "failed" };
    }
    return { url: null, status: "loading" };
  });

  useEffect(() => {
    if (!title) { setState({ url: null, status: "idle" }); return; }
    if (wikiImageCache[title] !== undefined) {
      setState({ url: wikiImageCache[title], status: wikiImageCache[title] ? "loaded" : "failed" });
      return;
    }
    let cancelled = false;
    const apiUrl = "https://en.wikipedia.org/w/api.php?action=query&titles=" +
      encodeURIComponent(title) + "&prop=pageimages&format=json&pithumbsize=640&origin=*";
    fetch(apiUrl)
      .then((res) => res.json())
      .then((data) => {
        if (cancelled) return;
        const pages = data && data.query && data.query.pages;
        const page = pages && Object.values(pages)[0];
        const src = page && page.thumbnail && page.thumbnail.source;
        wikiImageCache[title] = src || null;
        setState({ url: src || null, status: src ? "loaded" : "failed" });
      })
      .catch(() => {
        if (cancelled) return;
        wikiImageCache[title] = null;
        setState({ url: null, status: "failed" });
      });
    return () => { cancelled = true; };
  }, [title]);

  return state;
}

function SpeciesImage({ title, overrideUrl, alt, style }) {
  const [overrideFailed, setOverrideFailed] = useState(false);
  const hasOverride = overrideUrl && overrideUrl.trim() !== "" && !overrideFailed;
  const wiki = useWikiImage(hasOverride ? null : title);

  if (hasOverride) {
    return (
      <img
        src={overrideUrl}
        alt={alt}
        style={style}
        loading="lazy"
        onError={() => setOverrideFailed(true)}
      />
    );
  }
  if (wiki.status === "loaded" && wiki.url) {
    return <img src={wiki.url} alt={alt} style={style} loading="lazy" />;
  }
  return (
    <div style={{
      ...style,
      background: "#E3DCC9",
      display: "flex",
      alignItems: "center",
      justifyContent: "center",
      textAlign: "center",
      padding: "8px",
      fontFamily: "Inter, sans-serif",
      fontSize: "0.72rem",
      color: "#8A9880",
    }}>
      {wiki.status === "loading" ? "Loading photo…" : "Photo not available"}
    </div>
  );
}

function HomePage({ speciesCount, setPage }) {
  const [name, setName] = useState("");
  const [message, setMessage] = useState("");

  const [submitting, setSubmitting] = useState(false);

  const handleSubmit = async (e) => {

        <div style={{ position: "relative", maxWidth: "1180px", margin: "0 auto", padding: "0 24px 56px", width: "100%" }}>
          <p style={{ fontFamily: "Inter, sans-serif", fontSize: "0.85rem", letterSpacing: "0.04em", color: "#1B2B1E", marginBottom: "10px" }}>Forest Research Institute, Dehradun</p>
          <h1 style={{ fontFamily: "Lora, serif", fontWeight: 600, fontSize: "clamp(2rem, 4.6vw, 3.1rem)", lineHeight: 1.14, color: "#1B2B1E", maxWidth: "16ch", margin: "0 0 18px" }}>A digital record of the trees that shape this campus</h1>
          <p style={{ fontFamily: "Inter, sans-serif", fontSize: "1.02rem", maxWidth: "58ch", color: "#1B2B1E", lineHeight: 1.6, marginBottom: "28px" }}>
            The ICFRE-FRI campus holds one of India's most botanically significant tree collections — native forest species alongside exotic introductions planted over more than a century. This atlas documents each one: where it grows, how to identify it, and why it matters.
          </p>
          <div style={{ display: "flex", gap: "12px", flexWrap: "wrap" }}>

const POTENTIAL_USE_OPTIONS = [
  "Aromatic", "Essential oil", "Fodder", "Food", "Invasive", "Medicinal",
  "Ornamental", "Paper making", "Sacred / Socio-cultural", "Shade tree",
  "Soil water conservation", "Timber", "Wild Edible",
];

function PotentialUseFilter({ selected, onChange }) {
  const [open, setOpen] = useState(false);
  const [search, setSearch] = useState("");
  const containerRef = useRef(null);

  useEffect(() => {
    function handleClickOutside(e) {
      if (containerRef.current && !containerRef.current.contains(e.target)) setOpen(false);
    }
    document.addEventListener("mousedown", handleClickOutside);
    return () => document.removeEventListener("mousedown", handleClickOutside);
  }, []);

  const visibleOptions = POTENTIAL_USE_OPTIONS.filter((opt) =>
    opt.toLowerCase().includes(search.trim().toLowerCase())
  );

  const toggleOption = (opt) => {
    if (selected.includes(opt)) onChange(selected.filter((o) => o !== opt));
    else onChange([...selected, opt]);
  };

  const selectStyle = { fontFamily: "Inter, sans-serif", fontSize: "0.88rem", padding: "9px 12px", borderRadius: "5px", border: "1px solid #D6CEB4", background: "#FFFDF7", color: "#3A4739" };

  return (
    <div ref={containerRef} style={{ position: "relative" }}>
      <button
        onClick={() => setOpen((o) => !o)}
        style={{ ...selectStyle, cursor: "pointer", display: "flex", alignItems: "center", gap: "8px", justifyContent: "space-between", minWidth: "170px" }}
      >
        <span>Potential Use{selected.length > 0 ? ` (${selected.length})` : ""}</span>
        <span style={{ fontSize: "0.7rem" }}>{open ? "▲" : "▼"}</span>
      </button>
      {open && (
        <div style={{
          position: "absolute", top: "calc(100% + 4px)", left: 0, zIndex: 30,
          background: "#FFFDF7", border: "1px solid #D6CEB4", borderRadius: "8px",
          boxShadow: "0 10px 24px rgba(27,43,30,0.15)", width: "240px", maxHeight: "320px",
          display: "flex", flexDirection: "column", overflow: "hidden",
        }}>
          <div style={{ padding: "10px", borderBottom: "1px solid #E3DCC9" }}>
            <input
              type="text" placeholder="Search" value={search} onChange={(e) => setSearch(e.target.value)}
              autoFocus
              style={{ width: "100%", fontFamily: "Inter, sans-serif", fontSize: "0.85rem", padding: "7px 10px", borderRadius: "5px", border: "1px solid #D6CEB4", outline: "none" }}
            />
          </div>
          <div style={{ overflowY: "auto", padding: "6px 0" }}>
            {visibleOptions.length === 0 ? (
              <div style={{ padding: "10px 14px", fontFamily: "Inter, sans-serif", fontSize: "0.82rem", color: "#8A9880" }}>No matches</div>
            ) : visibleOptions.map((opt) => (
              <label key={opt} style={{ display: "flex", alignItems: "center", gap: "10px", padding: "9px 14px", cursor: "pointer", fontFamily: "Inter, sans-serif", fontSize: "0.88rem", color: "#2E3B28" }}>
                <input type="checkbox" checked={selected.includes(opt)} onChange={() => toggleOption(opt)} style={{ accentColor: "#4A6741", width: "15px", height: "15px" }} />
                {opt}
              </label>
            ))}
          </div>
          {selected.length > 0 && (
            <button
              onClick={() => onChange([])}
              style={{ fontFamily: "Inter, sans-serif", fontSize: "0.8rem", color: "#A6452F", background: "none", border: "none", borderTop: "1px solid #E3DCC9", padding: "9px 14px", textAlign: "left", cursor: "pointer" }}
            >
              Clear all
            </button>
          )}
        </div>
      )}
    </div>
  );
}

function ExplorePage({ species, onOpenSpecies }) {
  const [query, setQuery] = useState("");
  const [family, setFamily] = useState("All");
  const [origin, setOrigin] = useState("All");
  const [selectedUses, setSelectedUses] = useState([]);

  const families = useMemo(() => ["All", ...new Set(species.map((s) => s.fields.Family).filter(Boolean))].sort(), [species]);

  const filtered = species.filter((s) => {
    const f = s.fields;
    const q = query.trim().toLowerCase();
    const matchesQuery = !q || (f.CommonName || "").toLowerCase().includes(q) || (f.BotanicalName || "").toLowerCase().includes(q);
    const matchesFamily = family === "All" || f.Family === family;
    const matchesOrigin = origin === "All" || f.Origin === origin;
    const speciesUses = (f.PotentialUse || "").split(",").map((u) => u.trim()).filter(Boolean);
    const matchesUse = selectedUses.length === 0 || selectedUses.some((u) => speciesUses.includes(u));
    return matchesQuery && matchesFamily && matchesOrigin && matchesUse;
  });

  const selectStyle = { fontFamily: "Inter, sans-serif", fontSize: "0.88rem", padding: "9px 12px", borderRadius: "5px", border: "1px solid #D6CEB4", background: "#FFFDF7", color: "#3A4739" };

  return (
    <div style={{ maxWidth: "1180px", margin: "0 auto", padding: "48px 24px 80px" }}>
      <h1 style={{ fontFamily: "Lora, serif", fontSize: "2.1rem", color: "#1B2B1E", marginBottom: "6px" }}>Explore the collection</h1>
      <p style={{ fontFamily: "Inter, sans-serif", color: "#6B7A63", marginBottom: "28px" }}>{filtered.length} of {species.length} species shown</p>

      <div style={{ display: "flex", gap: "10px", flexWrap: "wrap", marginBottom: "36px", alignItems: "center" }}>
        <input type="text" placeholder="Search common or botanical name…" value={query} onChange={(e) => setQuery(e.target.value)} style={{ ...selectStyle, flex: "1 1 240px", minWidth: "220px" }} />
        <select value={family} onChange={(e) => setFamily(e.target.value)} style={selectStyle}>
          {families.map((f) => <option key={f} value={f}>{f === "All" ? "All families" : f}</option>)}
        </select>
        <select value={origin} onChange={(e) => setOrigin(e.target.value)} style={selectStyle}>
          {["All", "Native", "Exotic"].map((o) => <option key={o} value={o}>{o === "All" ? "All origins" : o}</option>)}
        </select>
        <PotentialUseFilter selected={selectedUses} onChange={setSelectedUses} />
      </div>

      {filtered.length === 0 ? (
        <div style={{ border: "1px dashed #D6CEB4", borderRadius: "8px", padding: "48px 24px", textAlign: "center", fontFamily: "Inter, sans-serif", color: "#6B7A63" }}>
          No species match these filters. Try widening your search.
        </div>
      ) : (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(240px, 1fr))", gap: "22px" }}>
          {filtered.map((s) => {
            const f = s.fields;
            return (
              <button key={s.id} onClick={() => onOpenSpecies(s)} style={{ textAlign: "left", cursor: "pointer", background: "#FFFDF7", border: "1px solid #E3DCC9", borderRadius: "8px", overflow: "hidden", padding: 0, display: "flex", flexDirection: "column", transition: "transform 0.15s ease, box-shadow 0.15s ease" }}
                onMouseEnter={(e) => { e.currentTarget.style.transform = "translateY(-3px)"; e.currentTarget.style.boxShadow = "0 10px 24px rgba(27,43,30,0.1)"; }}
                onMouseLeave={(e) => { e.currentTarget.style.transform = "translateY(0)"; e.currentTarget.style.boxShadow = "none"; }}>
                <div style={{ height: "150px", overflow: "hidden" }}>
                  <SpeciesImage title={f.BotanicalName} overrideUrl={f.CoverImageURL} alt={f.CommonName} style={{ width: "100%", height: "100%", objectFit: "cover" }} />
                </div>
                <div style={{ padding: "14px 16px 18px" }}>
                  <div style={{ marginBottom: "8px" }}><OriginTag origin={f.Origin} /></div>
                  <h3 style={{ fontFamily: "Lora, serif", fontSize: "1.08rem", color: "#1B2B1E", margin: "0 0 2px" }}>{f.CommonName}</h3>
                  <p style={{ fontFamily: "Inter, sans-serif", fontStyle: "italic", fontSize: "0.84rem", color: "#7A8873", margin: "0 0 8px" }}>{f.BotanicalName}</p>
                  <p style={{ fontFamily: "Inter, sans-serif", fontSize: "0.78rem", color: "#6B7A63", margin: 0 }}>{f.Family}</p>
                </div>
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

function GalleryImageCell({ label, url, alt }) {
  const [failed, setFailed] = useState(false);
  if (!url || !url.trim() || failed) return null;
  return (
    <div>
      <img
        src={url}
        alt={alt}
        style={{ width: "100%", height: "140px", objectFit: "cover", borderRadius: "6px", border: "1px solid #E3DCC9" }}
        loading="lazy"
        onError={() => setFailed(true)}
      />
      <div style={{ fontFamily: "Inter, sans-serif", fontSize: "0.72rem", color: "#8A9880", marginTop: "4px", textAlign: "center" }}>{label}</div>
    </div>
  );
}

function SpeciesDetailPage({ record, onBack, onViewOnMap }) {
  const f = record.fields;
  const sectionStyle = { marginBottom: "28px" };
  const labelStyle = { fontFamily: "Inter, sans-serif", fontSize: "0.72rem", letterSpacing: "0.04em", color: "#8A9880", marginBottom: "6px", fontWeight: 600 };
  const bodyStyle = { fontFamily: "Inter, sans-serif", fontSize: "0.96rem", color: "#2E3B28", lineHeight: 1.65 };

  const galleryItems = [
    { label: "Flower", url: f.FlowerImageURL },
    { label: "Fruit", url: f.FruitImageURL },
    { label: "Leaf", url: f.LeafImageURL },
    { label: "Bark", url: f.BarkImageURL },
  ].filter((item) => item.url && item.url.trim());

  return (
    <div style={{ maxWidth: "980px", margin: "0 auto", padding: "40px 24px 80px" }}>
      <button onClick={onBack} style={{ fontFamily: "Inter, sans-serif", fontSize: "0.88rem", color: "#4A6741", background: "none", border: "none", cursor: "pointer", marginBottom: "20px", padding: 0 }}>← Back to collection</button>
      <div style={{ marginBottom: "6px" }}><OriginTag origin={f.Origin} /></div>
      <h1 style={{ fontFamily: "Lora, serif", fontSize: "2.2rem", color: "#1B2B1E", margin: "8px 0 2px" }}>{f.CommonName}</h1>
      <p style={{ fontFamily: "Inter, sans-serif", fontStyle: "italic", fontSize: "1.05rem", color: "#7A8873", marginBottom: "24px" }}>{f.BotanicalName} · {f.Family}</p>

      <div style={{ marginBottom: galleryItems.length > 0 ? "12px" : "36px" }}>
        <SpeciesImage
          title={f.BotanicalName}
          overrideUrl={f.CoverImageURL}
          alt={f.CommonName}
          style={{ width: "100%", height: "380px", objectFit: "cover", borderRadius: "6px", border: "1px solid #E3DCC9" }}
        />
      </div>

      {galleryItems.length > 0 && (
        <div style={{ marginBottom: "36px" }}>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(130px, 1fr))", gap: "10px" }}>
            {galleryItems.map((item, i) => (
              <GalleryImageCell key={i} label={item.label} url={item.url} alt={`${f.CommonName} — ${item.label}`} />
            ))}
          </div>
        </div>
      )}

      <button onClick={() => onViewOnMap(record)} style={{ fontFamily: "Inter, sans-serif", fontWeight: 600, fontSize: "0.9rem", padding: "12px 22px", borderRadius: "5px", border: "none", cursor: "pointer", background: "#4A6741", color: "#F6F2E9", marginBottom: "40px" }}>
        View location on campus map
      </button>

      {f.Description && <div style={sectionStyle}><div style={labelStyle}>DESCRIPTION</div><p style={bodyStyle}>{f.Description}</p></div>}
      {f.Phenology && <div style={sectionStyle}><div style={labelStyle}>PHENOLOGY</div><p style={bodyStyle}>{f.Phenology}</p></div>}
      {f.Taxonomy && <div style={sectionStyle}><div style={labelStyle}>TAXONOMY</div><p style={bodyStyle}>{f.Taxonomy}</p></div>}
      {f.EcologicalUses && <div style={sectionStyle}><div style={labelStyle}>ECOLOGICAL ROLE</div><p style={bodyStyle}>{f.EcologicalUses}</p></div>}
      {f.EthnobotanicalUses && <div style={sectionStyle}><div style={labelStyle}>ETHNOBOTANICAL USES</div><p style={bodyStyle}>{f.EthnobotanicalUses}</p></div>}
      {f.SourceNote && (
        <div style={{ marginTop: "40px", padding: "14px 16px", borderRadius: "6px", background: "#EFEADB", fontFamily: "Inter, sans-serif", fontSize: "0.8rem", color: "#6B7A63" }}>
          <strong style={{ color: "#4E5C47" }}>Source note: </strong>{f.SourceNote}
        </div>
      )}
    </div>
  );
}

function MapPage({ species, focusedId }) {
  const [query, setQuery] = useState("");
  const [family, setFamily] = useState("All");
  const [selected, setSelected] = useState(null);
  const mapContainerRef = useRef(null);
  const mapInstanceRef = useRef(null);
  const markersRef = useRef([]);

  const withCoords = species.filter((s) => s.fields.Latitude != null && s.fields.Longitude != null);
  const families = useMemo(() => ["All", ...new Set(withCoords.map((s) => s.fields.Family).filter(Boolean))].sort(), [withCoords]);

  const filtered = withCoords.filter((s) => {
    const f = s.fields;
    const q = query.trim().toLowerCase();
    const matchesQuery = !q || (f.CommonName || "").toLowerCase().includes(q) || (f.BotanicalName || "").toLowerCase().includes(q);
    const matchesFamily = family === "All" || f.Family === family;
    return matchesQuery && matchesFamily;
  });

  // Initialize the Leaflet map once on mount.
  useEffect(() => {
    if (!mapContainerRef.current || mapInstanceRef.current) return;
    const map = L.map(mapContainerRef.current, { scrollWheelZoom: true }).setView([30.3398, 78.0349], 16);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    }).addTo(map);
    mapInstanceRef.current = map;
    return () => {
      map.remove();
      mapInstanceRef.current = null;
    };
  }, []);

  // Redraw markers whenever the filtered species list changes.
  useEffect(() => {
    const map = mapInstanceRef.current;
    if (!map) return;

    markersRef.current.forEach((m) => map.removeLayer(m));
    markersRef.current = [];

    const leafIcon = (isSelected) => L.divIcon({
      className: "",
      html: `<svg width="${isSelected ? 30 : 22}" height="${isSelected ? 30 : 22}" viewBox="0 0 24 24"><path d="M12 2C7.6 2 4 5.6 4 10c0 6 8 12 8 12s8-6 8-12c0-4.4-3.6-8-8-8Z" fill="${isSelected ? "#A6452F" : "#4A6741"}" stroke="#F6F2E9" stroke-width="1"/></svg>`,
      iconSize: [isSelected ? 30 : 22, isSelected ? 30 : 22],
      iconAnchor: [isSelected ? 15 : 11, isSelected ? 30 : 22],
    });

    filtered.forEach((s) => {
      const f = s.fields;
      const marker = L.marker([f.Latitude, f.Longitude], { icon: leafIcon(selected && selected.id === s.id) })
        .addTo(map)
        .bindPopup(`<strong>${f.CommonName}</strong><br/><em>${f.BotanicalName}</em>`);
      marker.on("click", () => setSelected(s));
      markersRef.current.push(marker);
    });
  }, [filtered, selected]);

  // Pan/zoom to a focused species (arriving from a detail page "view on map" click).
  useEffect(() => {
    if (!focusedId) return;
    const match = withCoords.find((s) => s.id === focusedId);
    if (match && mapInstanceRef.current) {
      setSelected(match);
      mapInstanceRef.current.setView([match.fields.Latitude, match.fields.Longitude], 18, { animate: true });
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [focusedId]);

  const selectStyle = { fontFamily: "Inter, sans-serif", fontSize: "0.88rem", padding: "9px 12px", borderRadius: "5px", border: "1px solid #D6CEB4", background: "#FFFDF7", color: "#3A4739" };

  return (
    <div style={{ maxWidth: "1180px", margin: "0 auto", padding: "40px 24px 80px" }}>
      <h1 style={{ fontFamily: "Lora, serif", fontSize: "2rem", color: "#1B2B1E", marginBottom: "6px" }}>Campus species map</h1>
      <p style={{ fontFamily: "Inter, sans-serif", color: "#6B7A63", marginBottom: "24px" }}>{filtered.length} mapped location{filtered.length === 1 ? "" : "s"}. Click a marker for details.</p>

      <div style={{ display: "flex", gap: "10px", flexWrap: "wrap", marginBottom: "20px" }}>
        <input type="text" placeholder="Search by name…" value={query} onChange={(e) => setQuery(e.target.value)} style={{ ...selectStyle, flex: "1 1 220px" }} />
        <select value={family} onChange={(e) => setFamily(e.target.value)} style={selectStyle}>
          {families.map((f) => <option key={f} value={f}>{f === "All" ? "All families" : f}</option>)}
        </select>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 320px", gap: "20px", alignItems: "start" }}>
        <div ref={mapContainerRef} style={{ height: "520px", borderRadius: "10px", border: "1px solid #E3DCC9" }} />

        <div style={{ border: "1px solid #E3DCC9", borderRadius: "10px", padding: "20px", background: "#FFFDF7", minHeight: "200px" }}>
          {selected ? (
            <>
              <div style={{ marginBottom: "12px" }}>
                <SpeciesImage title={selected.fields.BotanicalName} overrideUrl={selected.fields.CoverImageURL} alt={selected.fields.CommonName} style={{ width: "100%", height: "120px", objectFit: "cover", borderRadius: "6px" }} />
              </div>
              <div style={{ marginBottom: "6px" }}><OriginTag origin={selected.fields.Origin} /></div>
              <h3 style={{ fontFamily: "Lora, serif", fontSize: "1.1rem", color: "#1B2B1E", margin: "4px 0 2px" }}>{selected.fields.CommonName}</h3>
              <p style={{ fontFamily: "Inter, sans-serif", fontStyle: "italic", fontSize: "0.85rem", color: "#7A8873", marginBottom: "10px" }}>{selected.fields.BotanicalName}</p>
              <p style={{ fontFamily: "Inter, sans-serif", fontSize: "0.86rem", color: "#4E5C47", lineHeight: 1.5 }}>
                {selected.fields.Description ? selected.fields.Description.slice(0, 140) + (selected.fields.Description.length > 140 ? "…" : "") : "No description on file yet."}
              </p>
            </>
          ) : (
            <p style={{ fontFamily: "Inter, sans-serif", fontSize: "0.9rem", color: "#8A9880" }}>Select a marker to see species details here.</p>
          )}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [page, setPage] = useState("home");
  const [selectedSpecies, setSelectedSpecies] = useState(null);
  const [mapFocusId, setMapFocusId] = useState(null);
  const [species, setSpecies] = useState(FALLBACK_SPECIES);
  const [loadState, setLoadState] = useState("loading"); // loading | loaded | error

  useEffect(() => {
    loadSpeciesFromCsv(function (records, status) {
      setSpecies(records);
      setLoadState(status);
    });
  }, []);

  const openSpecies = useCallback((record) => { setSelectedSpecies(record); setPage("detail"); window.scrollTo(0, 0); }, []);
  const viewOnMap = useCallback((record) => { setMapFocusId(record.id); setPage("map"); window.scrollTo(0, 0); }, []);
  const goTo = (id) => { setPage(id); window.scrollTo(0, 0); };

  return (
    <div style={{ fontFamily: "Inter, sans-serif", background: "#F6F2E9", minHeight: "100vh" }}>
      <NavBar page={page === "detail" ? "explore" : page} setPage={goTo} />
      {loadState === "error" && (
        <div style={{ background: "#F7EBE6", borderBottom: "1px solid #E3C4B5", padding: "9px 24px", textAlign: "center", fontFamily: "Inter, sans-serif", fontSize: "0.8rem", color: "#8A3A28" }}>
          Couldn't load species.csv — showing sample data. Make sure species.csv is uploaded in the same folder as this page.
        </div>
      )}
      {loadState === "loading" ? (
        <div style={{ padding: "120px 24px", textAlign: "center", color: "#6B7A63", fontFamily: "Inter, sans-serif" }}>Loading species records…</div>
      ) : page === "home" ? (
        <HomePage speciesCount={species.length} setPage={goTo} />
      ) : page === "explore" ? (
        <ExplorePage species={species} onOpenSpecies={openSpecies} />
      ) : page === "detail" && selectedSpecies ? (
        <SpeciesDetailPage record={selectedSpecies} onBack={() => goTo("explore")} onViewOnMap={viewOnMap} />
      ) : page === "map" ? (
        <MapPage species={species} focusedId={mapFocusId} />
      ) : (
        <HomePage speciesCount={species.length} setPage={goTo} />
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
